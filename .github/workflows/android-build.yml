name: Moon TV Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -path './.git' -prune -o -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/moontv"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/moontv"

      - name: Find Android Gradle project
        id: project
        run: |
          WRAPPER=$(find "$RUNNER_TEMP/moontv" -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper not found in ZIP!"
            exit 1
          fi

          echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Build Moon TV APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moon-TV-APK
          path: ${{ steps.project.outputs.dir }}//build/outputs/apk//*.apk
          if-no-files-found: error
