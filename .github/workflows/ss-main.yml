name: Moon TV Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        run: |
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found on runner."
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found SDK Manager: $SDKMANAGER"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK Packages
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Find Project ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -path './.git' -prune -o \
            -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android Project
        run: |
          mkdir -p "$RUNNER_TEMP/moontv"
          unzip -q "${{ steps.zip.outputs.file }}" \
            -d "$RUNNER_TEMP/moontv"

      - name: Locate Gradle Project
        id: project
        run: |
          WRAPPER=$(find "$RUNNER_TEMP/moontv" \
            -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            echo "The ZIP must contain a complete Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Moon TV APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Moon TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Moon-TV-APK
          path: ${{ steps.project.outputs.dir }}//build/outputs/apk//*.apk
          if-no-files-found: error
          retention-days: 7
