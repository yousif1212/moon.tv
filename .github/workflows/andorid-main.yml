name: Moon TV Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Find and Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -path './.git' -prune -o -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP file found!"
            exit 1
          fi

          echo "Found project: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/moontv"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/moontv"

      - name: Find Android Gradle Project
        id: project
        run: |
          WRAPPER=$(find "$RUNNER_TEMP/moontv" -type f -name "gradlew" -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper (gradlew) was not found!"
            echo "The ZIP must contain a complete Android Gradle project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Moon TV APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Moon TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Moon-TV-APK
          path: ${{ steps.project.outputs.dir }}//build/outputs/apk//*.apk
          if-no-files-found: error
